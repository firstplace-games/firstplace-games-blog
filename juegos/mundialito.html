<style>
:root{
  --obs:#10131a; --obs2:#1b2130; --crema:#f3ead7; --oro:#e0ae52; --punto:#F4551D; --verde:#2f8a3b;
  --fd:"Archivo","Helvetica Neue",Arial,sans-serif; --fm:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0f18;color:var(--crema);font-family:var(--fd);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

#carga{position:fixed;inset:0;z-index:90;background:var(--obs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#carga.fuera{opacity:0;pointer-events:none}
#carga b{font-weight:900;font-stretch:125%;font-size:44px;letter-spacing:.02em}
#carga span{font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
#carga i{display:block;width:180px;height:4px;background:#232a38;position:relative;overflow:hidden}
#carga i::after{content:"";position:absolute;inset:0;width:40%;background:var(--punto);animation:cg 1s ease-in-out infinite}
@keyframes cg{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ── marcador ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.marcador{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));display:flex;align-items:stretch;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45))}
.mc{display:flex;align-items:center;gap:8px;background:var(--obs);padding:0 12px;transform:skewX(-12deg);height:40px}
.mc>*{transform:skewX(12deg)}
.mc .chip{width:9px;height:26px;border:1px solid rgba(255,255,255,.35)}
.mc .cod{font-weight:900;font-stretch:115%;font-size:17px;letter-spacing:.08em}
.mc.pts{background:var(--crema);color:var(--obs);font-weight:900;font-stretch:120%;font-size:24px;font-variant-numeric:tabular-nums;padding:0 14px;gap:10px}
.mc.pts b.sube{animation:sube .5s ease-out}
@keyframes sube{0%{transform:skewX(12deg) scale(1)}35%{transform:skewX(12deg) scale(1.6)}100%{transform:skewX(12deg) scale(1)}}
.mc.reloj{background:var(--punto);color:#fff;font-family:var(--fm);font-weight:600;font-size:15px;min-width:64px;justify-content:center}

#anuncio{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:92vw}
#anuncio .t{display:inline-block;font-weight:900;font-stretch:125%;font-size:clamp(40px,8vw,108px);line-height:.9;text-transform:uppercase;letter-spacing:-.01em;
  color:var(--crema);-webkit-text-stroke:2px var(--obs);text-shadow:6px 6px 0 var(--obs),0 0 40px rgba(255,160,60,.35);transform:rotate(-3deg)}
#anuncio .s{margin-top:14px;display:inline-block;background:var(--obs);color:var(--crema);font-family:var(--fm);font-size:clamp(11px,1.3vw,14px);letter-spacing:.16em;text-transform:uppercase;padding:7px 14px;transform:rotate(-1deg)}
#anuncio.on .t{animation:golpe .55s cubic-bezier(.2,1.6,.4,1) both}
#anuncio.on .s{animation:entra .4s .15s ease-out both}
#anuncio.chico .t{font-size:clamp(20px,3vw,36px);-webkit-text-stroke:1px var(--obs);text-shadow:4px 4px 0 var(--obs)}
@keyframes golpe{0%{transform:rotate(-3deg) scale(2.4);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}
@keyframes entra{0%{transform:translateY(12px) rotate(-1deg);opacity:0}100%{transform:rotate(-1deg);opacity:1}}
#anuncio.sale{transition:opacity .35s;opacity:0}

/* radar y jugador */
#radar{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:176px;height:114px;border:2px solid rgba(243,234,215,.5);background:rgba(20,60,30,.4);opacity:.88}
#quien{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5))}
#quien .n{background:var(--crema);color:var(--obs);font-weight:900;font-size:22px;min-width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
#quien .nom{background:var(--obs);padding:0 12px;height:42px;display:flex;flex-direction:column;justify-content:center}
#quien .nom b{font-weight:800;font-stretch:110%;font-size:16px;letter-spacing:.04em}
#quien .nom span{font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.65}
#potencia{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 52px);width:200px;height:12px;background:rgba(16,19,26,.8);border:2px solid var(--crema)}
#potencia i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6d44a,var(--punto) 70%,#e02020)}
.etiq{position:absolute;transform:translate(-50%,-100%);font-weight:800;font-size:12px;letter-spacing:.06em;white-space:nowrap;padding:2px 7px;background:rgba(16,19,26,.78);border-left:4px solid var(--punto)}
.etiq.riv{font-size:11px;opacity:.85;border-left-color:#9aa3b5}
.teclas{position:absolute;right:18px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(243,234,215,.85);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.teclas kbd{font-family:var(--fm);font-weight:600;background:rgba(16,19,26,.8);border:1px solid rgba(243,234,215,.35);padding:2px 6px;margin-left:5px;color:var(--crema)}
.botones{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.botones button{background:rgba(16,19,26,.82);color:var(--crema);border:2px solid rgba(243,234,215,.3);font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.1em;padding:7px 10px;min-width:40px}
.botones button[aria-pressed="true"]{background:var(--crema);color:var(--obs)}

/* ── pantallas ── */
.pant{position:fixed;inset:0;z-index:30;display:flex;align-items:center;padding:24px clamp(20px,6vw,90px);
  background:linear-gradient(90deg,rgba(11,15,24,.95) 0%,rgba(11,15,24,.84) 40%,rgba(11,15,24,.2) 75%,rgba(11,15,24,0) 100%);overflow-y:auto}
.pant .in{max-width:580px;margin:auto 0}
.kick{font-family:var(--fm);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--oro)}
.kick a{color:inherit;text-decoration:none}
.kick i{font-style:normal;color:var(--punto)}
.titulo{font-weight:900;font-stretch:125%;font-size:clamp(54px,9.5vw,130px);line-height:.82;letter-spacing:-.02em;margin:12px 0 8px;color:var(--crema);text-shadow:7px 7px 0 var(--punto)}
.titulo small{font-size:.32em;vertical-align:top;color:var(--oro);text-shadow:4px 4px 0 var(--obs);margin-left:.1em;letter-spacing:0}
.bajada{font-size:clamp(15px,1.5vw,17px);line-height:1.5;opacity:.92;max-width:50ch}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.seg{display:flex;border:2px solid rgba(243,234,215,.4)}
.seg button{background:transparent;color:var(--crema);border:0;font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px}
.seg button[aria-pressed="true"]{background:var(--crema);color:var(--obs)}
.btn{background:var(--punto);color:#fff;border:3px solid var(--crema);font-weight:900;font-stretch:115%;font-size:17px;letter-spacing:.14em;text-transform:uppercase;padding:14px 30px;
  box-shadow:6px 6px 0 rgba(0,0,0,.55);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(0,0,0,.55)}
.btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 rgba(0,0,0,.55)}
.btn.sec{background:transparent}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.rec{margin-top:14px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.ctl{margin-top:18px;font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.72;line-height:2.05}
.ctl kbd{font-family:var(--fm);border:1px solid rgba(243,234,215,.4);padding:1px 5px;margin:0 3px}
.pie{margin-top:20px;font-size:12px;line-height:1.55;opacity:.6;max-width:58ch}
.lbl{font-family:var(--fm);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-right:4px}

/* elegir selecciones */
#pElegir{align-items:flex-start;background:rgba(11,15,24,.93)}
#pElegir .in{max-width:1080px;width:100%;margin:0 auto}
.tabs{display:flex;gap:0;margin:16px 0 14px}
.tabs button{flex:1;background:transparent;color:var(--crema);border:2px solid rgba(243,234,215,.35);padding:12px 10px;text-align:left;display:flex;align-items:center;gap:12px}
.tabs button[aria-selected="true"]{background:var(--crema);color:var(--obs);border-color:var(--crema)}
.tabs .tl{font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;display:block}
.tabs .tn{font-weight:900;font-stretch:112%;font-size:20px;letter-spacing:.02em}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;padding-bottom:12px}
.pais{position:relative;background:var(--obs2);border:2px solid transparent;color:var(--crema);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s}
.pais:hover{transform:translate(-2px,-2px);border-color:rgba(243,234,215,.4)}
.pais[aria-pressed="true"]{border-color:var(--punto);box-shadow:4px 4px 0 var(--punto)}
.pais[data-off="1"]{opacity:.3;pointer-events:none}
.pais b{font-weight:900;font-stretch:115%;font-size:15px;letter-spacing:.06em}
.pais span{font-size:12px;opacity:.75;text-align:center;line-height:1.2}
.camiseta{width:62px;height:56px;clip-path:polygon(28% 0,40% 6%,60% 6%,72% 0,100% 16%,90% 40%,78% 34%,78% 100%,22% 100%,22% 34%,10% 40%,0 16%);position:relative}
.barra{position:sticky;bottom:-24px;z-index:2;margin:18px -4px 0;padding:14px 4px;background:rgba(11,15,24,.97);display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:2px solid rgba(243,234,215,.15)}
.vs{display:flex;align-items:center;gap:10px;font-weight:900;font-stretch:115%;font-size:22px;margin-right:auto}
.vs i{font-style:normal;font-family:var(--fm);font-size:12px;opacity:.6}
.vs .camiseta{width:38px;height:34px}

.fin .res{font-weight:900;font-stretch:125%;font-size:clamp(50px,8.5vw,112px);line-height:.85;text-transform:uppercase;margin:10px 0 12px}
.fin .res.g{text-shadow:7px 7px 0 var(--punto)} .fin .res.p{text-shadow:7px 7px 0 var(--obs2);opacity:.9}
.fin .marc{font-weight:800;font-size:clamp(24px,3vw,34px);font-variant-numeric:tabular-nums}
.goles{margin-top:10px;font-size:14px;line-height:1.6;opacity:.9}
.stats{margin-top:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;font-family:var(--fm);font-size:12px;letter-spacing:.06em;max-width:360px}
.stats span:nth-child(3n+2){text-align:center;opacity:.65;text-transform:uppercase;font-size:10.5px;letter-spacing:.14em}

/* ── táctil ── */
#tactil{position:fixed;inset:0;z-index:12;display:none;pointer-events:none}
.tactil.jugando #tactil{display:block}
#stick{position:absolute;left:0;top:0;width:45%;height:100%;pointer-events:auto}
#base{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(243,234,215,.45);background:rgba(16,19,26,.25);display:none;transform:translate(-50%,-50%)}
#perilla{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(243,234,215,.85);transform:translate(-50%,-50%)}
.tb{position:absolute;pointer-events:auto;border:3px solid var(--crema);color:#fff;font-weight:900;font-stretch:112%;letter-spacing:.06em;text-transform:uppercase;border-radius:50%;
  display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 rgba(0,0,0,.45);touch-action:none;font-size:11px;background:rgba(16,19,26,.72)}
#tTiro{right:calc(22px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:88px;height:88px;background:var(--punto);font-size:13px}
#tPase{right:calc(122px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:72px;height:72px;background:#2f6fd6}
#tHueco{right:calc(40px + env(safe-area-inset-right));bottom:calc(130px + env(safe-area-inset-bottom));width:62px;height:62px;background:#1f9a5a;font-size:9.5px;letter-spacing:0}
#tLargo{right:calc(122px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom));width:58px;height:58px;background:#c79a2a}
#tCamb{right:calc(208px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:52px;height:52px;font-size:18px}
#tPausa{left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:auto;height:auto;border-radius:0;padding:6px 12px;font-size:12px;border-width:2px}
.tb.on{transform:scale(.92);filter:brightness(1.25)}
.tactil .teclas{display:none}
.tactil #radar{width:150px;height:98px;bottom:auto;top:max(58px,calc(env(safe-area-inset-top) + 50px));left:auto;right:12px;transform:none}
.tactil #quien{bottom:auto;top:max(62px,calc(env(safe-area-inset-top) + 54px))}
.tactil #potencia{bottom:auto;top:max(112px,calc(env(safe-area-inset-top) + 104px))}
#girar{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;background:var(--obs);border:2px solid var(--oro);padding:12px 16px;font-family:var(--fm);font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:none;text-align:center}
@media (orientation:portrait) and (max-width:760px){ .tactil.jugando #girar{display:block} }
@media (max-width:760px){
  .pant{background:rgba(11,15,24,.9);align-items:flex-start}
  .mc{height:32px;padding:0 9px}.mc .cod{font-size:14px}.mc.pts{font-size:19px}.mc.reloj{font-size:13px;min-width:52px}
  .teclas{display:none}
  .grilla{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}
}
@media (max-height:500px){
  #pElegir{padding:10px 16px}
  .tabs{margin:8px 0}
  .tabs button{padding:6px 10px}.tabs .camiseta{width:34px;height:30px}.tabs .tn{font-size:16px}
  .grilla{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
  .pais{padding:6px 4px}.pais span:not(.camiseta){display:none}.pais .camiseta{width:40px;height:36px}.pais b{font-size:13px}
  .barra{padding:8px 4px;gap:8px;bottom:-10px}.vs{font-size:16px}.vs .camiseta{width:26px;height:24px}
  .barra .lbl{display:none}.seg button{padding:7px 8px;font-size:10px}.barra .btn{padding:9px 16px;font-size:14px}
  .pant{align-items:flex-start}
  .titulo{font-size:58px}
  #quien .n{height:34px;min-width:34px;font-size:18px}#quien .nom{height:34px}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="carga"><b>MUNDIALITO</b><i></i><span id="cargaTxt">Marcando la cancha</span></div>

<div id="hud">
  <div class="marcador" id="marcador" hidden>
    <div class="mc"><i class="chip" id="ch0"></i><span class="cod" id="c0"></span></div>
    <div class="mc pts"><b id="s0">0</b><span>-</span><b id="s1">0</b></div>
    <div class="mc"><span class="cod" id="c1"></span><i class="chip" id="ch1"></i></div>
    <div class="mc reloj" id="reloj">0'</div>
  </div>
  <div id="anuncio"><div class="t" id="anT"></div><br><div class="s" id="anS" hidden></div></div>
  <canvas id="radar" width="210" height="136" hidden></canvas>
  <div id="quien" hidden><span class="n" id="qN"></span><span class="nom"><b id="qNom"></b><span id="qRol"></span></span></div>
  <div id="potencia" hidden><i id="potI"></i></div>
  <div id="etiquetas"></div>
  <div class="teclas" id="teclas" hidden></div>
  <div class="botones">
    <button type="button" id="bCam" aria-label="Cámara">CAM</button>
    <button type="button" id="bSon" aria-pressed="true" aria-label="Sonido">♪</button>
    <button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button>
  </div>
</div>

<div id="tactil">
  <div id="stick"><div id="base"><div id="perilla"></div></div></div>
  <button class="tb" id="tTiro" type="button"></button>
  <button class="tb" id="tPase" type="button"></button>
  <button class="tb" id="tHueco" type="button"></button>
  <button class="tb" id="tLargo" type="button"></button>
  <button class="tb" id="tCamb" type="button" aria-label="Cambiar">⇄</button>
  <button class="tb" id="tPausa" type="button">II</button>
</div>
<div id="girar"></div>

<section class="pant" id="pInicio" hidden><div class="in">
  <p class="kick"><a href="../juegos.html">← FirstPlace<i>.</i>games</a> · <span id="iKick"></span></p>
  <h1 class="titulo">MUNDIALITO<small>3D</small></h1>
  <p class="bajada" id="iBaj"></p>
  <div class="fila"><button class="btn" id="bElegir" type="button"></button></div>
  <p class="rec" id="iRec"></p>
  <p class="ctl" id="iCtl"></p>
  <p class="pie" id="iPie"></p>
</div></section>

<section class="pant" id="pElegir" hidden><div class="in">
  <p class="kick"><a href="#" id="eVolver">←</a> · <span id="eKick"></span></p>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabYo" aria-selected="true"><span class="camiseta" id="kYo"></span><span><span class="tl" id="tlYo"></span><span class="tn" id="tnYo">—</span></span></button>
    <button type="button" role="tab" id="tabRiv" aria-selected="false"><span class="camiseta" id="kRiv"></span><span><span class="tl" id="tlRiv"></span><span class="tn" id="tnRiv">—</span></span></button>
  </div>
  <div class="grilla" id="grilla"></div>
  <div class="barra">
    <div class="vs" id="vs"></div>
    <span class="lbl" id="lNivel"></span><div class="seg" id="nivel"></div>
    <span class="lbl" id="lDur"></span><div class="seg" id="dur"></div>
    <button class="btn" id="bJugar" type="button" disabled></button>
  </div>
</div></section>

<section class="pant fin" id="pFin" hidden><div class="in">
  <p class="kick" id="fKick"></p>
  <h2 class="res" id="fRes"></h2>
  <p class="marc" id="fMarc"></p>
  <div class="goles" id="fGoles"></div>
