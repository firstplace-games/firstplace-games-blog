<style>
:root{
  --obs:#15110e; --obs2:#221a14; --crema:#f3ead7; --oro:#e0ae52; --punto:#F4551D;
  --rojo:#b3261e; --jade:#12a37f; --turq:#2bc4c9; --terra:#b8583a;
  --fd:"Archivo","Helvetica Neue",Arial,sans-serif; --fm:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#15110e;color:var(--crema);font-family:var(--fd);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

/* ── carga ── */
#carga{position:fixed;inset:0;z-index:90;background:var(--obs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#carga.fuera{opacity:0;pointer-events:none}
#carga b{font-weight:900;font-stretch:125%;font-size:44px;letter-spacing:.02em}
#carga span{font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
#carga i{display:block;width:180px;height:4px;background:#2c231c;position:relative;overflow:hidden}
#carga i::after{content:"";position:absolute;inset:0;width:40%;background:var(--punto);animation:cg 1s ease-in-out infinite}
@keyframes cg{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ── marcador ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.marcador{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(22px,env(safe-area-inset-left));display:flex;align-items:stretch;gap:6px;
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45))}
.eq{display:flex;align-items:center;gap:12px;padding:7px 18px 8px;transform:skewX(-12deg);min-width:clamp(150px,19vw,230px)}
.eq>*{transform:skewX(12deg)}
.eq.e0{background:var(--rojo);justify-content:flex-end}
.eq.e1{background:var(--jade);flex-direction:row-reverse;justify-content:flex-end}
.eq .nom{font-weight:800;font-stretch:112%;font-size:clamp(11px,1.25vw,15px);letter-spacing:.14em;text-transform:uppercase}
.eq .pts{font-weight:900;font-stretch:120%;font-size:clamp(30px,3.6vw,46px);line-height:.9;font-variant-numeric:tabular-nums;min-width:1.1ch;text-align:center}
.eq .pts.sube{animation:sube .5s ease-out}
@keyframes sube{0%{transform:skewX(12deg) scale(1)}35%{transform:skewX(12deg) scale(1.55)}100%{transform:skewX(12deg) scale(1)}}
.eq svg{width:26px;height:26px;flex:none}
.centro{background:var(--obs);transform:skewX(-12deg);padding:6px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:88px}
.centro>*{transform:skewX(12deg)}
.centro .a{font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}
.centro .r{font-weight:800;font-size:clamp(15px,1.6vw,19px);font-variant-numeric:tabular-nums;line-height:1.1}
.centro .rl{font-family:var(--fm);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}

/* ── anuncio ── */
#anuncio{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#anuncio .t{display:inline-block;font-weight:900;font-stretch:125%;font-size:clamp(40px,8vw,104px);line-height:.9;text-transform:uppercase;letter-spacing:-.01em;
  color:var(--crema);-webkit-text-stroke:2px var(--obs);text-shadow:6px 6px 0 var(--obs),0 0 40px rgba(255,160,60,.35);transform:rotate(-3deg)}
#anuncio .s{margin-top:14px;display:inline-block;background:var(--obs);color:var(--crema);font-family:var(--fm);font-size:clamp(11px,1.3vw,14px);letter-spacing:.16em;text-transform:uppercase;padding:7px 14px;transform:rotate(-1deg)}
#anuncio.on .t{animation:golpe .55s cubic-bezier(.2,1.6,.4,1) both}
#anuncio.on .s{animation:entra .4s .15s ease-out both}
#anuncio.chico .t{font-size:clamp(22px,3.4vw,40px);-webkit-text-stroke:1px var(--obs);text-shadow:4px 4px 0 var(--obs)}
@keyframes golpe{0%{transform:rotate(-3deg) scale(2.4);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}
@keyframes entra{0%{transform:translateY(12px) rotate(-1deg);opacity:0}100%{transform:rotate(-1deg);opacity:1}}
#anuncio.sale{transition:opacity .35s;opacity:0}

/* ── ayuda de teclas ── */
.teclas{position:absolute;left:18px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:14px;flex-wrap:wrap;font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(243,234,215,.85);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.teclas kbd{font-family:var(--fm);font-weight:600;background:rgba(21,17,14,.8);border:1px solid rgba(243,234,215,.35);padding:2px 6px;margin-right:5px;color:var(--crema)}
.botones{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.botones button{background:rgba(21,17,14,.82);color:var(--crema);border:2px solid rgba(243,234,215,.3);font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.1em;padding:7px 10px;min-width:40px}
.botones button[aria-pressed="true"]{background:var(--crema);color:var(--obs)}

/* ── pantallas ── */
.pant{position:fixed;inset:0;z-index:30;display:flex;align-items:center;padding:24px clamp(20px,6vw,90px);
  background:linear-gradient(90deg,rgba(21,17,14,.94) 0%,rgba(21,17,14,.82) 38%,rgba(21,17,14,.15) 72%,rgba(21,17,14,0) 100%);overflow-y:auto}
.pant[hidden]{display:none}
.pant .in{max-width:560px;margin:auto 0}
.kick{font-family:var(--fm);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--oro)}
.kick i{font-style:normal;color:var(--punto)}
.titulo{font-weight:900;font-stretch:125%;font-size:clamp(64px,11vw,148px);line-height:.82;letter-spacing:-.02em;margin:12px 0 6px;
  color:var(--crema);text-shadow:7px 7px 0 var(--rojo)}
.titulo small{font-size:.32em;vertical-align:top;color:var(--jade);text-shadow:4px 4px 0 var(--obs);margin-left:.1em;letter-spacing:0}
.bajada{font-size:clamp(15px,1.5vw,17px);line-height:1.5;opacity:.92;max-width:48ch}
.reglas{margin:22px 0 0;display:grid;gap:7px;font-size:14px;line-height:1.45}
.reglas div{padding-left:22px;position:relative;opacity:.92}
.reglas div::before{content:"";position:absolute;left:0;top:.5em;width:11px;height:11px;background:var(--punto);transform:rotate(45deg) scale(.7)}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.nivel{display:flex;border:2px solid rgba(243,234,215,.4)}
.nivel button{background:transparent;color:var(--crema);border:0;font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:11px 13px}
.nivel button[aria-pressed="true"]{background:var(--crema);color:var(--obs)}
.btn{background:var(--punto);color:#fff;border:3px solid var(--crema);font-weight:900;font-stretch:115%;font-size:17px;letter-spacing:.14em;text-transform:uppercase;padding:14px 34px;
  box-shadow:6px 6px 0 rgba(0,0,0,.55);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(0,0,0,.55)}
.btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 rgba(0,0,0,.55)}
.btn.sec{background:transparent}
.rec{margin-top:14px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.ctl{margin-top:20px;font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;line-height:2}
.ctl kbd{font-family:var(--fm);border:1px solid rgba(243,234,215,.4);padding:1px 5px;margin:0 3px}
.pie{margin-top:22px;font-size:12px;line-height:1.55;opacity:.6;max-width:56ch}
.pie a{color:inherit}
.fin .res{font-weight:900;font-stretch:125%;font-size:clamp(54px,9vw,120px);line-height:.85;text-transform:uppercase;margin:10px 0 12px}
.fin .res.g{text-shadow:7px 7px 0 var(--rojo)} .fin .res.p{text-shadow:7px 7px 0 var(--obs2);opacity:.9}
.fin .marc{font-weight:800;font-size:clamp(26px,3vw,36px);font-variant-numeric:tabular-nums}

/* ── mandos táctiles ── */
#tactil{position:fixed;inset:0;z-index:12;display:none;pointer-events:none}
.tactil.jugando #tactil{display:block}
#stick{position:absolute;left:0;top:0;width:50%;height:100%;pointer-events:auto}
#base{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(243,234,215,.45);background:rgba(21,17,14,.25);display:none;transform:translate(-50%,-50%)}
#perilla{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(243,234,215,.85);transform:translate(-50%,-50%)}
.tb{position:absolute;pointer-events:auto;border:3px solid var(--crema);color:#fff;font-weight:900;font-stretch:112%;letter-spacing:.08em;text-transform:uppercase;border-radius:50%;
  display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 rgba(0,0,0,.45);touch-action:none}
#tGolpe{right:calc(24px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:96px;height:96px;background:var(--punto);font-size:13px}
#tBarr{right:calc(132px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:70px;height:70px;background:rgba(21,17,14,.75);font-size:10px}
#tCamb{right:calc(56px + env(safe-area-inset-right));bottom:calc(142px + env(safe-area-inset-bottom));width:52px;height:52px;background:rgba(21,17,14,.75);font-size:18px}
.tb.on{transform:scale(.92);filter:brightness(1.2)}
.tactil .teclas{display:none}
#girar{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:40;background:var(--obs);border:2px solid var(--oro);padding:8px 14px;font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:none}
@media (orientation:portrait) and (max-width:700px){ .tactil.jugando #girar.mostrar{display:block} }
@media (max-width:700px){
  .pant{background:rgba(21,17,14,.9);align-items:flex-start}
  .eq{min-width:0;padding:6px 10px;gap:8px}.eq .nom{display:none}.eq svg{width:20px;height:20px}
  .centro{min-width:70px;padding:5px 10px}
  .teclas{display:none}
}
@media (max-height:500px){
  .pant{align-items:flex-start}
  .titulo{font-size:64px}
  .reglas{font-size:12.5px;gap:4px}
}
</style>
