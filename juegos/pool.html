<style>
:root{
  --obs:#120e0b; --obs2:#1f1813; --crema:#f3ead7; --oro:#e0ae52; --punto:#F4551D; --verde:#1f9d5a; --rojo:#c8102e;
  --fd:"Archivo","Helvetica Neue",Arial,sans-serif; --fm:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0907;color:var(--crema);font-family:var(--fd);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;cursor:crosshair}
#app.mano canvas{cursor:grab}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
.vin{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}

/* carga */
#carga{position:fixed;inset:0;z-index:90;background:var(--obs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#carga.fuera{opacity:0;pointer-events:none}
#carga b{font-weight:900;font-stretch:125%;font-size:44px;letter-spacing:.02em}
#carga span{font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
#carga i{display:block;width:180px;height:4px;background:#2c231c;position:relative;overflow:hidden}
#carga i::after{content:"";position:absolute;inset:0;width:40%;background:var(--punto);animation:cg 1s ease-in-out infinite}
@keyframes cg{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* marcador */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.marcador{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.5))}
.jug{display:flex;align-items:center;gap:12px;padding:8px 18px 9px;background:rgba(18,14,11,.88);transform:skewX(-12deg);min-width:clamp(170px,22vw,270px);border:2px solid transparent;transition:background .25s,border-color .25s}
.jug>*{transform:skewX(12deg)}
.jug.j1{flex-direction:row-reverse}
.jug.activo{background:var(--crema);color:var(--obs)}
.jug .nom{font-weight:900;font-stretch:115%;font-size:clamp(12px,1.3vw,16px);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.jug .grp{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;white-space:nowrap}
.jug .info{display:flex;flex-direction:column;gap:5px}
.jug.j1 .info{align-items:flex-end}
.bolitas{display:flex;gap:3px}
.bolitas i{width:13px;height:13px;border-radius:50%;display:block;box-shadow:inset -2px -2px 3px rgba(0,0,0,.35),inset 1px 1px 2px rgba(255,255,255,.35);position:relative}
.bolitas i.ray{background:#f6f1e2!important;overflow:hidden}
.bolitas i.ray::after{content:"";position:absolute;left:0;right:0;top:3.5px;height:6px;background:var(--c)}
.bolitas i.fuera{opacity:.18;filter:grayscale(1)}
.bolitas i.vacia{background:rgba(127,127,127,.25)!important;box-shadow:none}
.vs{background:var(--punto);color:#fff;transform:skewX(-12deg);padding:0 12px;display:flex;align-items:center;font-weight:900;font-stretch:120%;font-size:15px;letter-spacing:.08em}
.vs>*{transform:skewX(12deg)}

/* aviso */
#aviso{position:absolute;left:50%;top:clamp(80px,13vh,120px);transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap}
#aviso .t{display:inline-block;background:var(--obs);color:var(--crema);font-weight:900;font-stretch:115%;font-size:clamp(15px,1.8vw,22px);letter-spacing:.08em;text-transform:uppercase;padding:8px 18px 9px;transform:rotate(-1.5deg);box-shadow:5px 5px 0 rgba(0,0,0,.45);border:2px solid var(--crema)}
#aviso .t.falta{background:var(--rojo);border-color:#fff}
#aviso .t.bien{background:var(--verde)}
#aviso .s{display:block;margin-top:8px;font-family:var(--fm);font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 3px #000}
#aviso.on .t{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:rotate(-1.5deg) scale(1.8);opacity:0}100%{transform:rotate(-1.5deg) scale(1);opacity:1}}
#aviso.sale{transition:opacity .35s;opacity:0}
#gran{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;text-align:center}
#gran b{display:inline-block;font-weight:900;font-stretch:125%;font-size:clamp(44px,9vw,120px);line-height:.9;text-transform:uppercase;color:var(--crema);-webkit-text-stroke:2px var(--obs);text-shadow:6px 6px 0 var(--obs);transform:rotate(-3deg)}
#gran.on b{animation:golpe .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes golpe{0%{transform:rotate(-3deg) scale(2.4);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}

/* botones arriba a la derecha */
.botones{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.botones button{background:rgba(18,14,11,.82);color:var(--crema);border:2px solid rgba(243,234,215,.3);font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.1em;padding:7px 10px;min-width:40px}
.botones button[aria-pressed="true"]{background:var(--crema);color:var(--obs)}
.teclas{position:absolute;left:18px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:14px;flex-wrap:wrap;max-width:60vw;font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(243,234,215,.85);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.teclas kbd{font-family:var(--fm);font-weight:600;background:rgba(18,14,11,.8);border:1px solid rgba(243,234,215,.35);padding:2px 6px;margin-right:5px;color:var(--crema)}

/* fuerza */
#fuerza{position:absolute;right:max(22px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:58px;height:min(46vh,340px);pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;gap:8px}
#fuerza .lab,#efecto .lab{font-family:var(--fm);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px 3px #000}
#fuerza .riel{position:relative;flex:1;width:30px;background:rgba(18,14,11,.85);border:2px solid rgba(243,234,215,.55);box-shadow:4px 4px 0 rgba(0,0,0,.45);overflow:hidden;cursor:ns-resize}
#fuerza .llen{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(180deg,#f7d36b,#F4551D 70%,#c8102e)}
#fuerza .marca{position:absolute;left:0;right:0;height:2px;background:rgba(243,234,215,.25)}
#fuerza .pct{font-family:var(--fm);font-size:11px;font-weight:600;min-height:14px}
#fuerza .pista{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.55;pointer-events:none}
#fuerza.off,#efecto.off{opacity:.35;pointer-events:none}

/* efecto */
#efecto{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
#efecto .bola{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf6,#e9e2cf 55%,#a59e8a);border:2px solid rgba(243,234,215,.7);position:relative;cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.45);touch-action:none}
#efecto .bola::before,#efecto .bola::after{content:"";position:absolute;background:rgba(0,0,0,.14)}
#efecto .bola::before{left:50%;top:10%;bottom:10%;width:1px}
#efecto .bola::after{top:50%;left:10%;right:10%;height:1px}
#efecto .punto{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--rojo);border:2px solid #fff;transform:translate(-50%,-50%);left:50%;top:50%;pointer-events:none}

/* pantallas */
.pant{position:fixed;inset:0;z-index:30;display:flex;align-items:center;padding:24px clamp(20px,6vw,90px);
  background:linear-gradient(90deg,rgba(12,9,7,.95) 0%,rgba(12,9,7,.84) 38%,rgba(12,9,7,.15) 72%,rgba(12,9,7,0) 100%);overflow-y:auto}
.pant .in{max-width:580px;margin:auto 0}
.kick{font-family:var(--fm);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--oro)}
.kick a{color:inherit;text-decoration:none}
.kick i{font-style:normal;color:var(--punto)}
.titulo{font-weight:900;font-stretch:125%;font-size:clamp(60px,10vw,138px);line-height:.82;letter-spacing:-.02em;margin:12px 0 8px;color:var(--crema);text-shadow:7px 7px 0 var(--verde)}
.titulo small{font-size:.32em;vertical-align:top;color:var(--oro);text-shadow:4px 4px 0 var(--obs);margin-left:.1em;letter-spacing:0}
.bajada{font-size:clamp(15px,1.5vw,17px);line-height:1.5;opacity:.92;max-width:48ch}
.reglas{margin:22px 0 0;display:grid;gap:7px;font-size:14px;line-height:1.45}
.reglas div{padding-left:22px;position:relative;opacity:.92}
.reglas div::before{content:"";position:absolute;left:0;top:.5em;width:11px;height:11px;background:var(--punto);transform:rotate(45deg) scale(.7)}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.nivel{display:flex;border:2px solid rgba(243,234,215,.4)}
.nivel button{background:transparent;color:var(--crema);border:0;font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:11px 13px}
.nivel button[aria-pressed="true"]{background:var(--crema);color:var(--obs)}
.btn{background:var(--punto);color:#fff;border:3px solid var(--crema);font-weight:900;font-stretch:115%;font-size:17px;letter-spacing:.14em;text-transform:uppercase;padding:14px 34px;box-shadow:6px 6px 0 rgba(0,0,0,.55);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(0,0,0,.55)}
.btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 rgba(0,0,0,.55)}
.btn.sec{background:transparent}
.rec{margin-top:14px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.ctl{margin-top:18px;font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;line-height:2}
.ctl kbd{font-family:var(--fm);border:1px solid rgba(243,234,215,.4);padding:1px 5px;margin:0 3px}
.pie{margin-top:20px;font-size:12px;line-height:1.55;opacity:.6;max-width:56ch}
.fin .res{font-weight:900;font-stretch:125%;font-size:clamp(54px,9vw,120px);line-height:.85;text-transform:uppercase;margin:10px 0 12px}
.fin .res.g{text-shadow:7px 7px 0 var(--verde)} .fin .res.p{text-shadow:7px 7px 0 var(--rojo)}

@media (max-width:760px){
  .pant{background:rgba(12,9,7,.9);align-items:flex-start}
  .jug{min-width:0;padding:6px 10px;gap:8px}.jug .grp{display:none}.bolitas i{width:9px;height:9px}
  .bolitas i.ray::after{top:2.5px;height:4px}
  .marcador{left:12px;transform:none}
  .vs{padding:0 7px;font-size:12px}
  .teclas{display:none}
  #fuerza{width:48px;height:38vh}
  #efecto .bola{width:58px;height:58px}
  .botones button{padding:6px 7px;min-width:32px}
  #aviso{top:auto;bottom:24vh}
}
@media (max-width:560px){
  .botones{top:calc(max(14px,env(safe-area-inset-top)) + 52px)}
  .marcador{left:10px;right:10px;justify-content:center}
  .jug{flex:1}
}
@media (max-height:500px){
  #fuerza{top:44%;height:44vh}
  .pant{align-items:flex-start}
  .titulo{font-size:60px}
  .reglas{font-size:12.5px;gap:4px}
  .marcador{left:12px;transform:none}
  #fuerza{height:52vh}
}
</style>
</head>
