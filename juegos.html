<style>
:root{
  --hueso:#F2EFE9; --tinta:#141A1F; --punto:#F4551D; --ambar:#C98A16;
  --verde:#0E8F63; --azul:#2B4C6F; --papel:#FBFAF7; --linea:#DCD7CD; --apagado:#6B7480;
  --sombra:rgba(20,26,31,.9);
  --fd:"Archivo","Helvetica Neue",Arial,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hueso:#12171C; --tinta:#F2EFE9; --papel:#1B2229; --linea:#2C343D; --apagado:#98A2AE;
  --punto:#FF7034; --ambar:#DFA53B; --verde:#28B183; --azul:#5A87B8; --sombra:rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  --hueso:#12171C; --tinta:#F2EFE9; --papel:#1B2229; --linea:#2C343D; --apagado:#98A2AE;
  --punto:#FF7034; --ambar:#DFA53B; --verde:#28B183; --azul:#5A87B8; --sombra:rgba(0,0,0,.75);
}
*{box-sizing:border-box}
body{margin:0;background:var(--hueso);color:var(--tinta);font-family:var(--fd);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.05;font-stretch:112%;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--punto);outline-offset:3px}
.ancho{max-width:1560px;margin:0 auto;padding:0 22px}

/* aviso */
.aviso{background:var(--tinta);color:var(--hueso);font-family:var(--fm);font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;padding:9px 0}
.aviso .ancho{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.aviso b{color:var(--punto);font-weight:600}

/* cabecera + idioma */
header{padding:32px 0 6px}
.fila1{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.migas{font-family:var(--fm);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--apagado)}
.migas i{font-style:normal;color:var(--punto)}
.idioma{margin-left:auto;display:flex;border:2px solid var(--tinta)}
.idioma button{border:0;background:transparent;color:var(--tinta);font-family:var(--fm);
  font-size:11px;font-weight:600;letter-spacing:.12em;padding:7px 13px;cursor:pointer}
.idioma button[aria-pressed="true"]{background:var(--tinta);color:var(--hueso)}
h1{margin:12px 0 0;font-size:clamp(38px,6.2vw,60px);font-weight:800;font-stretch:120%;
  letter-spacing:-.03em;text-transform:uppercase}
.sub{margin:12px 0 0;font-size:17px;color:var(--apagado);max-width:58ch}

/* ── banda del día ── */
.banda{width:100%;background:var(--papel);border-top:3px solid var(--tinta);
  border-bottom:3px solid var(--tinta);margin-top:28px;padding:16px 0 20px}
.banda .hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.banda .hd .st{background:var(--punto);color:#fff;font-weight:800;font-size:12px;
  letter-spacing:.17em;text-transform:uppercase;padding:6px 12px 7px;transform:rotate(-1.4deg)}
.banda .hd .rj{font-family:var(--fm);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--apagado);margin-left:auto}
.banda .hd .rj b{color:var(--punto);font-weight:600}
.cinco{display:grid;gap:13px;grid-template-columns:1fr 1.62fr 1fr;align-items:stretch}
.lado{display:grid;gap:13px;grid-template-rows:1fr 1fr}
.mini{border:3px solid var(--tinta);background:var(--punto);color:#fff;
  box-shadow:5px 5px 0 var(--sombra);padding:13px 14px 14px;text-decoration:none;
  display:flex;flex-direction:column;gap:6px;position:relative;min-height:112px}
.mini:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--sombra)}
.mini.m0{background:var(--punto)} .mini.m1{background:var(--azul)}
.mini.m2{background:var(--verde)} .mini.m3{background:var(--ambar)}
.mini .top{display:flex;align-items:center;gap:9px}
.mini .ic{width:30px;height:30px;flex:0 0 30px;border:2px solid rgba(255,255,255,.85);
  display:grid;place-items:center}
.mini .ic svg{width:19px;height:19px;display:block}
.mini .nm{font-size:15px;font-weight:800;font-stretch:112%;letter-spacing:-.015em;line-height:1.1}
.mini .ba{font-size:12.5px;opacity:.95;line-height:1.35}
.mini .md{margin-top:auto;font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;opacity:.9}
.mini.hecho::after{content:attr(data-sello);position:absolute;right:-7px;bottom:9px;
  transform:rotate(-8deg);border:3px solid var(--tinta);background:var(--hueso);color:var(--tinta);
  font-family:var(--fd);font-weight:800;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 9px 5px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.centro{border:3px solid var(--tinta);background:var(--tinta);color:var(--hueso);
  box-shadow:6px 6px 0 var(--sombra);display:grid;grid-template-columns:minmax(0,186px) 1fr;
  text-decoration:none;overflow:hidden}
.centro:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--sombra)}
.centro .art{background:#F2EFE9;border-right:3px solid var(--tinta);padding:14px 14px 12px}
.centro .art svg{width:100%;height:100%;display:block}
.centro .txt{padding:16px 18px 17px;display:flex;flex-direction:column}
.centro .et{font-family:var(--fm);font-size:10px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--punto);font-weight:600}
.centro h2{font-size:clamp(28px,3.4vw,40px);font-weight:800;font-stretch:120%;
  letter-spacing:-.03em;text-transform:uppercase;margin:6px 0 0}
.centro p{margin:8px 0 0;font-size:14.5px;max-width:50ch;opacity:.9}
.centro .pie{margin-top:auto;padding-top:14px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.jugar{display:inline-block;border:3px solid var(--hueso);background:var(--punto);color:#fff;
  font-family:var(--fd);font-weight:800;font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:10px 18px;text-decoration:none}
.marca{font-family:var(--fm);font-size:10.5px;letter-spacing:.09em;opacity:.78}

/* ── tres columnas, a todo el ancho ── */
.tres{margin-top:46px;display:grid;gap:24px;grid-template-columns:repeat(3,1fr)}
.zona{display:flex;flex-direction:column}
.rotulo{display:inline-block;align-self:flex-start;transform:rotate(-1.4deg);
  background:var(--tinta);color:var(--hueso);font-family:var(--fd);font-weight:800;font-size:13px;
  letter-spacing:.17em;text-transform:uppercase;padding:7px 14px 8px;margin:0 0 -9px 8px;
  position:relative;z-index:3}
.zona .caja{border:3px solid var(--tinta);background:var(--papel);box-shadow:8px 8px 0 var(--sombra);
  padding:20px 18px 18px;flex:1}
.bajada{font-size:14px;color:var(--apagado);margin:0 0 14px}
.rejilla{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.t{border:2px solid var(--tinta);background:var(--punto);color:#fff;padding:12px 12px 13px;
  text-decoration:none;display:flex;flex-direction:column;gap:7px;min-height:138px;
  box-shadow:4px 4px 0 var(--sombra)}
.t:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sombra)}
.t0{background:var(--punto)} .t1{background:var(--azul)} .t2{background:var(--ambar)}
.t3{background:var(--verde)}
.t .ic2{width:36px;height:36px;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center}
.t .ic2 svg{width:23px;height:23px;display:block}
.t .nm{font-size:15.5px;font-weight:800;font-stretch:112%;letter-spacing:-.015em;line-height:1.1}
.t .ba{font-size:12px;opacity:.94;line-height:1.35}
.t .meta{margin-top:auto;font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;opacity:.92}
.t.pronto{background:transparent;color:var(--apagado);border-style:dashed;box-shadow:none;
  pointer-events:none}
.t.pronto .ic2{border-color:var(--linea)}
.t.pronto .ic2 svg{opacity:.5}

.notas{margin-top:52px;border-top:1px solid var(--linea);padding:24px 0 60px;
  display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.notas h4{font-family:var(--fm);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--punto);font-weight:600;margin-bottom:8px}
.notas p{font-size:13.5px;color:var(--apagado);line-height:1.6}
.notas b{color:var(--tinta)}

/* botón de regreso */
/* mismo lenguaje que las tarjetas: borde de tinta, esquinas rectas, sombra dura */
.regreso{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;margin-top:-7px;
  background:var(--punto);color:#fff;text-decoration:none;border:2px solid var(--tinta);
  font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;box-shadow:3px 3px 0 var(--sombra);transition:transform .15s,box-shadow .15s}
.regreso:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--sombra)}

@media (max-width:1180px){
  .cinco{grid-template-columns:1fr 1fr}
  .centro{grid-column:1 / -1;order:-1}
}
@media (max-width:1000px){ .tres{grid-template-columns:1fr 1fr} }
@media (max-width:700px){
  .cinco{grid-template-columns:1fr}
  .centro{grid-template-columns:1fr;order:-1}
  .centro .art{border-right:0;border-bottom:3px solid var(--tinta)}
  .tres{grid-template-columns:1fr}
  .centro,.zona .caja,.mini{box-shadow:5px 5px 0 var(--sombra)}
}
</style>

/* ═══════ reloj ═══════ */
function restoDelDia(){
  var a = new Date(Date.now() - 3*3600*1000);
  var min = (23 - a.getUTCHours())*60 + (60 - a.getUTCMinutes());
  var h = Math.floor(min/60), m = min%60;
  return (h ? h+' h ' : '') + m + ' min';
}

/* ═══════ jugado hoy (lo anotan los juegos del día) ═══════ */
function yaSeJugoHoy(id){
  var d = null;
  try { d = JSON.parse(localStorage.getItem('juegos-jugado-hoy') || 'null'); } catch(e){}
  var hoy = new Date(Date.now() - 3*3600*1000).toISOString().slice(0,10);
  return !!(d && d.fecha === hoy && Array.isArray(d.juegos) && d.juegos.indexOf(id) !== -1);
}

/* ═══════ pintado ═══════ */
var $ = function(id){ return document.getElementById(id); };

function pintar(){
  var t = T[LANG];
  document.documentElement.lang = LANG;

  $('miga2').textContent = t.miga;
  $('regreso').textContent = t.regreso;
  $('regreso').setAttribute('aria-label', t.regresoAria);
  $('h1').textContent    = t.h1;
  $('sub').textContent   = t.sub;
  $('sub').hidden        = !t.sub;   /* sin texto no deja un hueco */
  $('stDia').textContent = t.stDia;
  $('cEt').textContent   = t.cEt;
  $('cBa').textContent   = t.cBa;
  $('cBtn').textContent  = t.cBtn;
  $('cMd').textContent   = t.cMd;
  ['Arcade','Pensar','Mundo'].forEach(function(k){
    $('r'+k).textContent = t['r'+k];
    $('b'+k).textContent = t['b'+k];
  });
  $('notas').innerHTML = t.notas.map(function(n){
    return '<div><h4>'+n[0]+'</h4><p>'+n[1]+'</p></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.idioma button'), function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-l') === LANG ? 'true' : 'false');
  });

  var n = 0;
  ['A','B'].forEach(function(l){
    $('lado'+l).innerHTML = CHICOS.filter(function(c){ return c.lado === l; }).map(function(c){
      var cls = 'mini m' + (n++ % 4) + ((c.est === 'hecho' || (c.id && yaSeJugoHoy(c.id))) ? ' hecho' : '');
      return '<a class="'+cls+'" href="'+(c.url || '#')+'" data-sello="'+t.sello+'">'
           + '<span class="top"><span class="ic">'+svg(c.ic)+'</span><span class="nm">'+c.nm+'</span></span>'
           + '<span class="ba">'+c.ba[LANG]+'</span>'
           + '<span class="md">'+c.md[LANG]+'</span></a>';
    }).join('');
  });

  ['arcade','pensar','mundo'].forEach(function(z){
    var k = 0, destino = { arcade:'zArcade', pensar:'zPensar', mundo:'zMundo' }[z];
    $(destino).innerHTML = JUEGOS.filter(function(j){ return j.z === z; }).map(function(j){
      var cls  = j.pronto ? 't pronto' : 't t' + (k++ % 4);
      var href = j.url ? ' href="'+j.url+'"' : ' href="#"';
      return '<a class="'+cls+'"'+href+'><span class="ic2">'+svg(j.ic)+'</span>'
           + '<span class="nm">'+j.nm+'</span><span class="ba">'+j.ba[LANG]+'</span>'
           + '<span class="meta">'+j.meta[LANG]+'</span></a>';
    }).join('');
  });

  reloj();
}
function reloj(){
  var t = T[LANG];
  $('rj').innerHTML = t.reloj + ' <b>' + restoDelDia() + '</b>';
}

document.querySelector('.idioma').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  LANG = b.getAttribute('data-l');
  try { localStorage.setItem('fp-lang', LANG); } catch(err){}
  pintar();
});

pintar();
setInterval(reloj, 60000);
